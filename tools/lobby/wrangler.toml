# The lobby for VF1, VF2 and VF3 Recomp's online play (tools/lobby/README.md: setting it up)
name = "vf-lobby"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[durable_objects.bindings]]
name = "QUEUES"
class_name = "Queue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limits"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Queue"]

# Tries per address (an IPv6 one by its /64) a minute: anything, opening rooms, joining, the relay's logins. Generous
# for a house, a LAN party or a phone network's shared address; a flood or a code guessed at is stopped.
[[ratelimits]]
name = "ANY_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "HOST_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "TURN_LIMIT"
namespace_id = "1004"
simple = { limit = 10, period = 60 }
